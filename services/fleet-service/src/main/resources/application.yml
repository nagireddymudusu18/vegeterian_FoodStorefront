server:
  port: ${SERVER_PORT:8085}
  forward-headers-strategy: native

spring:
  application:
    name: fleet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet}
    username: ${DB_USER:fleet}
    password: ${DB_PASSWORD:fleet}
    # No standing connections: one is opened when an action needs the database and closed after it sits idle.
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      maximum-pool-size: ${DB_POOL_MAX:10}
      idle-timeout: ${DB_POOL_IDLE_MS:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt-public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  internal-feed-key: ${INTERNAL_FEED_KEY:}
  max-active-deliveries: ${MAX_ACTIVE_DELIVERIES:2}
  feed:
    order-url: ${ORDER_FEED_URL:http://localhost:8083}
    order-key: ${ORDER_FEED_KEY:}
    batch-size: 100