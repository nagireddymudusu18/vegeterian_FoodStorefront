server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    # No standing connections: one is opened when an action needs the database and closed after it sits idle.
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      maximum-pool-size: ${DB_POOL_MAX:10}
      idle-timeout: ${DB_POOL_IDLE_MS:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    # the request id (see RequestIdFilter) is in every log line written while a request is served
    level: "%5p [%X{requestId:-}]"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  internal-feed-key: ${INTERNAL_FEED_KEY:}
  jwt-public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  seed-demo-data: ${SEED_DEMO_DATA:false}
