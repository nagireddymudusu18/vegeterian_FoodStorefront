name: deploy

# Builds one image per service, pushes it to GHCR, then updates the server over SSH.
# Staging deploys from `develop`, production from `main`. Configure these in
# Settings > Environments (staging, production): secrets SSH_HOST, SSH_USER, SSH_KEY, SSH_HOST_FINGERPRINT and variable DOMAIN.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: identity-service, context: services/identity-service }
          - { name: catalog-service, context: services/catalog-service }
          - { name: order-service, context: services/order-service }
          - { name: payment-service, context: services/payment-service }
          - { name: fleet-service, context: services/fleet-service }
          - { name: storefront, context: storefront }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/veggo-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
            ${{ steps.img.outputs.ref }}:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_BASE=https://${{ vars.DOMAIN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency: deploy-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the server's SSH host fingerprint
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "Secret SSH_HOST_FINGERPRINT is not set (see docs/deployment.md); refusing to deploy without host verification." >&2
            exit 1
          fi
      - name: Copy deploy files
        # pinned to a commit: a moved tag must not be able to read SSH_KEY (v0.1.7)
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: deploy/prod/docker-compose.prod.yml,deploy/prod/Caddyfile,deploy/prod/init-db.sh
          target: /opt/veggoeats
          strip_components: 2
      - name: Roll out
        # pinned to a commit (v1.0.3)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -e
            cd /opt/veggoeats
            sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
            PROFILE=""
            if grep -q '^DB_HOST=db$' .env; then PROFILE="--profile with-db"; fi
            docker compose -f docker-compose.prod.yml $PROFILE pull
            docker compose -f docker-compose.prod.yml $PROFILE up -d --remove-orphans
            docker image prune -f
