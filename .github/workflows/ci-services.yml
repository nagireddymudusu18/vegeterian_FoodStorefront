name: ci-java-services

on:
  push:
    paths: ["services/**", ".github/workflows/ci-services.yml"]
  pull_request:
    paths: ["services/**", ".github/workflows/ci-services.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity-service, catalog-service, order-service, payment-service, fleet-service]
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            changed:
              - 'services/${{ matrix.service }}/**'
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Verify
        if: steps.changes.outputs.changed == 'true'
        working-directory: services/${{ matrix.service }}
        run: mvn -B verify
      - name: Build image
        if: steps.changes.outputs.changed == 'true'
        run: docker build -t foodapp/${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
