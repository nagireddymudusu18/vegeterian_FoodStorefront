apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels: { app: order-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: foodapp/order-service:latest
          ports:
            - containerPort: 8083
          env:
            - { name: SERVER_PORT, value: "8083" }
            - { name: DB_URL, valueFrom: { secretKeyRef: { name: order-service-db, key: DB_URL } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: order-service-db, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: order-service-db, key: DB_PASSWORD } } }
            - { name: INTERNAL_FEED_KEY, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: ORDER_FEED_KEY } } }
            - { name: JWT_PUBLIC_KEY_PEM, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: JWT_PUBLIC_KEY_PEM } } }
            - { name: CATALOG_FEED_KEY, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: CATALOG_FEED_KEY } } }
            - { name: PAYMENT_FEED_KEY, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: PAYMENT_FEED_KEY } } }
            - { name: CATALOG_FEED_URL, value: "http://catalog-service:8082" }
            - { name: PAYMENT_FEED_URL, value: "http://payment-service:8084" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector: { app: order-service }
  ports:
    - port: 8083
      targetPort: 8083
