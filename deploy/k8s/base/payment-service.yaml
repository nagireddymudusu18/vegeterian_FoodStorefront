apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels: { app: payment-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: foodapp/payment-service:latest
          ports:
            - containerPort: 8084
          env:
            - { name: SERVER_PORT, value: "8084" }
            - { name: DB_URL, valueFrom: { secretKeyRef: { name: payment-service-db, key: DB_URL } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: payment-service-db, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: payment-service-db, key: DB_PASSWORD } } }
            - { name: INTERNAL_FEED_KEY, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: PAYMENT_FEED_KEY } } }
            - { name: JWT_PUBLIC_KEY_PEM, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: JWT_PUBLIC_KEY_PEM } } }
            - { name: RAZORPAY_KEY_ID, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: RAZORPAY_KEY_ID } } }
            - { name: RAZORPAY_KEY_SECRET, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: RAZORPAY_KEY_SECRET } } }
            - { name: RAZORPAY_WEBHOOK_SECRET, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: RAZORPAY_WEBHOOK_SECRET } } }
            - { name: GATEWAY, value: fake }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector: { app: payment-service }
  ports:
    - port: 8084
      targetPort: 8084
