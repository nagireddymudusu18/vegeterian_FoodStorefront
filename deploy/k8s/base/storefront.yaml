apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels: { app: storefront }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storefront }
  template:
    metadata:
      labels: { app: storefront }
    spec:
      containers:
        - name: storefront
          image: foodapp/storefront:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector: { app: storefront }
  ports:
    - port: 3000
      targetPort: 3000
