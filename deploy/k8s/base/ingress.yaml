# Edge routing equivalent of deploy/compose/Caddyfile. Requires an ingress controller that supports
# regex rewrite (shown for ingress-nginx); /internal/** is never exposed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodapp-edge
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: foodapp.example.com
      http:
        paths:
          - { path: /api/identity(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: identity-service, port: { number: 8081 } } } }
          - { path: /api/catalog(/|$)(.*),  pathType: ImplementationSpecific, backend: { service: { name: catalog-service,  port: { number: 8082 } } } }
          - { path: /api/orders(/|$)(.*),   pathType: ImplementationSpecific, backend: { service: { name: order-service,    port: { number: 8083 } } } }
          - { path: /api/payments(/|$)(.*), pathType: ImplementationSpecific, backend: { service: { name: payment-service,  port: { number: 8084 } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodapp-storefront
spec:
  rules:
    - host: foodapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: storefront, port: { number: 3000 } } }
