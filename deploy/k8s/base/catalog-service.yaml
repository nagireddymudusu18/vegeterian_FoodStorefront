apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels: { app: catalog-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-service }
  template:
    metadata:
      labels: { app: catalog-service }
    spec:
      containers:
        - name: catalog-service
          image: foodapp/catalog-service:latest
          ports:
            - containerPort: 8082
          env:
            - { name: SERVER_PORT, value: "8082" }
            - { name: DB_URL, valueFrom: { secretKeyRef: { name: catalog-service-db, key: DB_URL } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: catalog-service-db, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: catalog-service-db, key: DB_PASSWORD } } }
            - { name: INTERNAL_FEED_KEY, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: CATALOG_FEED_KEY } } }
            - { name: JWT_PUBLIC_KEY_PEM, valueFrom: { secretKeyRef: { name: foodapp-secrets, key: JWT_PUBLIC_KEY_PEM } } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 640Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector: { app: catalog-service }
  ports:
    - port: 8082
      targetPort: 8082
