# Local stack. First run: node ../scripts/gen-keys.mjs   then: docker compose up --build
# Every service owns its database; no service depends_on another service (only on its own DB).
name: foodapp

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    JAVA_OPTS: "-XX:MaxRAMPercentage=70"
    SPRING_PROFILES_ACTIVE: local

services:
  identity-db:
    image: postgres:16
    environment: { POSTGRES_DB: identity, POSTGRES_USER: identity, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [identity-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U identity"], interval: 5s, timeout: 3s, retries: 10 }

  catalog-db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_DB: catalog, POSTGRES_USER: catalog, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [catalog-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U catalog"], interval: 5s, timeout: 3s, retries: 10 }

  order-db:
    image: postgres:16
    environment: { POSTGRES_DB: order, POSTGRES_USER: order, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [order-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U order"], interval: 5s, timeout: 3s, retries: 10 }

  payment-db:
    image: postgres:16
    environment: { POSTGRES_DB: payment, POSTGRES_USER: payment, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [payment-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U payment"], interval: 5s, timeout: 3s, retries: 10 }

  identity-service:
    <<: *java-service
    build: ../../services/identity-service
    depends_on: { identity-db: { condition: service_healthy } }
    environment:
      <<: *java-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://identity-db:5432/identity
      DB_USER: identity
      DB_PASSWORD: "${DB_PASSWORD}"
      INTERNAL_FEED_KEY: "${IDENTITY_FEED_KEY}"
      JWT_PRIVATE_KEY_PEM: "${JWT_PRIVATE_KEY_PEM}"
      JWT_PUBLIC_KEY_PEM: "${JWT_PUBLIC_KEY_PEM}"
      PII_ENC_KEY: "${PII_ENC_KEY}"
      PII_HMAC_KEY: "${PII_HMAC_KEY}"
      SMS_PROVIDER: logging
      EMAIL_PROVIDER: logging
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}

  catalog-service:
    <<: *java-service
    build: ../../services/catalog-service
    depends_on: { catalog-db: { condition: service_healthy } }
    environment:
      <<: *java-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://catalog-db:5432/catalog
      DB_USER: catalog
      DB_PASSWORD: "${DB_PASSWORD}"
      INTERNAL_FEED_KEY: "${CATALOG_FEED_KEY}"
      JWT_PUBLIC_KEY_PEM: "${JWT_PUBLIC_KEY_PEM}"
      SEED_DEMO_DATA: "true"

  order-service:
    <<: *java-service
    build: ../../services/order-service
    depends_on: { order-db: { condition: service_healthy } }
    environment:
      <<: *java-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://order-db:5432/order
      DB_USER: order
      DB_PASSWORD: "${DB_PASSWORD}"
      INTERNAL_FEED_KEY: "${ORDER_FEED_KEY}"
      JWT_PUBLIC_KEY_PEM: "${JWT_PUBLIC_KEY_PEM}"
      # Feeds are polled over the network; the producers may be down without affecting startup.
      CATALOG_FEED_URL: http://catalog-service:8082
      CATALOG_FEED_KEY: "${CATALOG_FEED_KEY}"
      PAYMENT_FEED_URL: http://payment-service:8084
      PAYMENT_FEED_KEY: "${PAYMENT_FEED_KEY}"
      FLEET_FEED_URL: http://fleet-service:8085
      FLEET_FEED_KEY: "${FLEET_FEED_KEY}"
      FEED_POLL_MS: 2000

  payment-service:
    <<: *java-service
    build: ../../services/payment-service
    depends_on: { payment-db: { condition: service_healthy } }
    environment:
      <<: *java-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://payment-db:5432/payment
      DB_USER: payment
      DB_PASSWORD: "${DB_PASSWORD}"
      INTERNAL_FEED_KEY: "${PAYMENT_FEED_KEY}"
      JWT_PUBLIC_KEY_PEM: "${JWT_PUBLIC_KEY_PEM}"
      GATEWAY: "${GATEWAY:-fake}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"

  fleet-db:
    image: postgres:16
    environment: { POSTGRES_DB: fleet, POSTGRES_USER: fleet, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [fleet-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fleet"], interval: 5s, timeout: 3s, retries: 10 }

  fleet-service:
    <<: *java-service
    build: ../../services/fleet-service
    depends_on: { fleet-db: { condition: service_healthy } }
    environment:
      <<: *java-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://fleet-db:5432/fleet
      DB_USER: fleet
      DB_PASSWORD: "${DB_PASSWORD}"
      INTERNAL_FEED_KEY: "${FLEET_FEED_KEY}"
      JWT_PUBLIC_KEY_PEM: "${JWT_PUBLIC_KEY_PEM}"
      ORDER_FEED_URL: http://order-service:8083
      ORDER_FEED_KEY: "${ORDER_FEED_KEY}"
      FEED_POLL_MS: 2000

  storefront:
    build:
      context: ../../storefront
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8080
    restart: unless-stopped

  edge:
    image: caddy:2
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]

volumes:
  identity-data:
  catalog-data:
  order-data:
  payment-data:
  fleet-data:
